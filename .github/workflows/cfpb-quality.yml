name: CFPB model quality addon
on:
  push:
    paths:
      - 'cfpb_quality/**'
      - 'tests_quality/**'
      - 'scripts/make_demo_predictions.py'
      - 'requirements-quality.txt'
      - '.github/workflows/cfpb-quality.yml'
  pull_request:
    paths:
      - 'cfpb_quality/**'
      - 'tests_quality/**'
      - 'scripts/make_demo_predictions.py'
      - 'requirements-quality.txt'
      - '.github/workflows/cfpb-quality.yml'
jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-quality.txt
      - run: python -m pytest -q tests_quality
      - run: python -m scripts.make_demo_predictions
      - run: python -m cfpb_quality --predictions demo_predictions.csv --data-kind synthetic --out artifacts/model_quality
