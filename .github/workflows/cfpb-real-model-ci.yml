name: CFPB research model integration
on:
  push:
    paths:
      - 'src/model_quality_research.py'
      - 'scripts/evaluate_real_cfpb.py'
      - 'tests_quality/test_real_model_integration.py'
      - 'cfpb_quality/**'
      - 'requirements-quality.txt'
      - '.github/workflows/cfpb-real-model-ci.yml'
  pull_request:
    paths:
      - 'src/model_quality_research.py'
      - 'scripts/evaluate_real_cfpb.py'
      - 'tests_quality/test_real_model_integration.py'
      - 'cfpb_quality/**'
      - 'requirements-quality.txt'
      - '.github/workflows/cfpb-real-model-ci.yml'
jobs:
  research-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-quality.txt
      - run: python -m pytest -q tests_quality
